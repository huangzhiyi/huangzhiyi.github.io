<!DOCTYPE html>
<html lang="zh-CN">
	<head>
		<meta charset="UTF-8">
		<meta name="viewport" content="width=device-width, initial-scale=1.0">
		<title></title>
		<script src="js/jquery-3.6.0.min.js"></script>
		<!-- <script src="js/course-min.js?260818"></script> -->
		<!-- <link rel="stylesheet" type="text/css" href="css/course-min.css?260818"> -->
		<script src="js/course.js?260818"></script>
		<link rel="stylesheet" type="text/css" href="css/course.css">
	</head>
	<body>
		<div style="margin: 0 auto">
			<h1 id="title"></h1>
		</div>
		<div class="schedule-container">
			<table id="currTable">
				<!-- 第1周 -->
				<tr>
					<th class="week-title" id="weekPanel">第<span class="current-week"></span>周</th>
					<th><span id="w1-date"></span><br><span class="weekday">周一</span><span id="w1-rmk"
							class="remark"></span></th>
					<th><span id="w2-date"></span><br><span class="weekday">周二</span><span id="w2-rmk"
							class="remark"></span></th>
					<th><span id="w3-date"></span><br><span class="weekday">周三</span><span id="w3-rmk"
							class="remark"></span></th>
					<th><span id="w4-date"></span><br><span class="weekday">周四</span><span id="w4-rmk"
							class="remark"></span></th>
					<th><span id="w5-date"></span><br><span class="weekday">周五</span><span id="w5-rmk"
							class="remark"></span></th>
					<th><span id="w6-date"></span><br><span class="weekday">周六</span><span id="w6-rmk"
							class="remark"></span></th>
					<th><span id="w7-date"></span><br><span class="weekday">周日</span><span id="w7-rmk"
							class="remark"></span></th>
				</tr>
				<tr>
					<td class="time-col ">第1-2节<br>8:30-9:15<br>9:20-10:05</td>
					<td class="course-cell " id="c1-1"></td>
					<td class="course-cell " id="c2-1"></td>
					<td class="course-cell " id="c3-1"></td>
					<td class="course-cell " id="c4-1"></td>
					<td class="course-cell " id="c5-1"></td>
					<td class="weekend" id="c6-1"></td>
					<td class="weekend" id="c7-1"></td>
				</tr>
				<tr class="db-bot-line">
					<td class="time-col ">第3-4节<br>10:25-11:10<br>11:15-12:00</td>
					<td class="course-cell " id="c1-3"></td>
					<td class="course-cell " id="c2-3"></td>
					<td class="course-cell " id="c3-3"></td>
					<td class="course-cell " id="c4-3"></td>
					<td class="course-cell " id="c5-3"></td>
					<td class="weekend" id="c6-3"></td>
					<td class="weekend" id="c7-3"></td>
				</tr>
				<tr>
					<td class="time-col ">第5-6节<br>14:00-14:45<br>14:50-15:35</td>
					<td class="course-cell " id="c1-5"></td>
					<td class="course-cell " id="c2-5"></td>
					<td class="course-cell " id="c3-5"></td>
					<td class="course-cell " id="c4-5"></td>
					<td class="course-cell " id="c5-5"></td>
					<td class="weekend" id="c6-5"></td>
					<td class="weekend" id="c7-5"></td>
				</tr>
				<tr class="db-bot-line">
					<td class="time-col ">第7-8节<br>15:55-16:40<br>16:45-17:30</td>
					<td class="course-cell " id="c1-7"></td>
					<td class="course-cell " id="c2-7"></td>
					<td class="course-cell " id="c3-7"></td>
					<td class="course-cell " id="c4-7"></td>
					<td class="course-cell " id="c5-7"></td>
					<td class="weekend" id="c6-7"></td>
					<td class="weekend" id="c7-7"></td>
				</tr>
				<tr id="night-row">
					<td class="time-col ">第9-10节<br>19:00-19:45<br>19:50-20:35</td>
					<td class="course-cell " id="c1-9"></td>
					<td class="course-cell " id="c2-9"></td>
					<td class="course-cell " id="c3-9"></td>
					<td class="course-cell " id="c4-9"></td>
					<td class="course-cell " id="c5-9"></td>
					<td class="weekend" id="c6-9"></td>
					<td class="weekend" id="c7-9"></td>
				</tr>
			</table>
		</div>
		<div id="bottom-btn-bar">
			<div class="btn-group">
				<button class="btn btn-primary " id="prevBtn">&LT;上周</button>
				<div style="font-size:2rem;font-weight:bold;padding:8px 8px;color:#d9534f;">第<span
						class="current-week"></span>周</div>
				<button class="btn btn-primary" id="nextBtn">下周&GT;</button>
				<div class="break"></div>
				<button id="weekendToggleBtn" class="btn btn-primary">显示全部课程</button>
				<button class="btn btn-danger" id="todayBtn">今天课程</button>
				<button class="btn btn-primary" id="printBtn" onclick="window.print()">打印课程表</button>
				<div class="break"></div>
				<div id="week-btn-bar"></div>
			</div>
		</div>
	</body>
</html>
